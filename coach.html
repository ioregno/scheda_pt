<!doctype html><html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111111">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Coach</title>
<link rel="stylesheet" href="tema.css">
<script src="tono.js"></script>
<style>
/* pagina del coach: solo layout dei moduli, colori e font vengono da tema.css */
.cw{max-width:560px;margin:0 auto;padding:18px 16px 140px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px}
.crow{display:flex;gap:10px;align-items:center;justify-content:space-between}
.cl{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:2px;background:var(--surface);border-radius:20px;padding:14px 16px}
.cl b{font:800 22px/1 var(--display);text-transform:uppercase}
.cl small{color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:5px;font:600 12px/1.2 var(--body);color:var(--muted)}
.f input,.f select,.f textarea,.inl{width:100%;border:1.5px solid var(--line2);background:var(--bg);color:var(--ink);border-radius:14px;padding:11px 12px;font:500 16px/1.3 var(--body)}
.f textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dh{display:flex;align-items:center;gap:10px}
.dh .sw{width:14px;height:14px;border-radius:50%;background:var(--dc);flex:none}
.dh input{flex:1;font:800 22px/1 var(--display);text-transform:uppercase;border:0;background:transparent;color:var(--ink);padding:4px 0;min-width:0}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.tabs button{border:0;border-radius:999px;padding:10px 6px;background:var(--bg);font:700 13px/1 var(--body)}
.tabs button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.el{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.el li{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;background:var(--bg);border-radius:14px;padding:9px 8px 9px 10px}
.el .n{font:800 18px/1 var(--display);color:var(--muted)}
.el .t{min-width:0}
.el .t b{display:block;font:600 15px/1.25 var(--body);overflow-wrap:anywhere}
.el .t small{color:var(--muted)}
.ic{display:flex;gap:2px}
.ic button{border:0;background:none;width:34px;height:34px;border-radius:10px;font:600 17px/1 var(--body);color:var(--ink)}
.ic button:active{background:var(--line)}
.ic button:disabled{opacity:.25}
.small{font-size:13px;padding:9px 14px}
.danger{color:#D0021B;border-color:#D0021B}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.catres{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.gtiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gtiles button,.blist button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--bg);border-radius:16px;padding:16px 14px}
.gtiles b,.blist b{font:700 16px/1.1 var(--body)}
.gtiles small,.blist small{color:var(--muted);font:600 13px/1 var(--body)}
.blist{display:flex;flex-direction:column;gap:6px}
.blist em{font:600 11px/1 var(--body);font-style:normal;color:var(--accent);margin-left:auto}
.chosen{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;background:var(--bg);border-radius:16px;padding:8px}
.chosen img,.chosen .noimg{width:64px;height:64px;object-fit:contain;background:#fff;border-radius:12px}
.chosen b{display:block;font:600 16px/1.2 var(--body)}.chosen small{color:var(--muted)}
details.more{display:flex;flex-direction:column;gap:10px}
#sheet>.back{align-self:flex-start}
details.more>summary{cursor:pointer;font:600 14px/1.2 var(--body);color:var(--muted);padding:6px 0}
details.more[open]>summary{margin-bottom:10px}
details.more .f{margin-top:10px}
.catres button{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center;background:var(--bg);border-radius:14px;padding:6px 10px 6px 6px}
.catres img,.catres .noimg{width:56px;height:56px;object-fit:contain;background:#fff;border-radius:10px}
.catres b{display:block;font:600 15px/1.25 var(--body)}
.catres small{color:var(--muted)}
#recV video,#recV canvas{width:100%;border-radius:16px;background:#000;max-height:44vh;object-fit:contain;display:block;margin-bottom:8px}
.recst{color:var(--muted);font:600 13px/1.4 var(--body);margin:4px 0}
.recsay{background:var(--bg);border-radius:14px;padding:12px;font:500 14px/1.4 var(--body);margin:8px 0}
.catres small i{font-style:normal;color:var(--accent);font-weight:700}
.chips button{border:1.5px solid var(--line2);background:transparent;border-radius:999px;padding:7px 11px;font:600 13px/1 var(--body)}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.mph{display:flex;gap:10px;align-items:center}
.mph img{width:64px;height:64px;object-fit:cover;border-radius:12px;background:#fff;flex:none}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.foot .in{max-width:560px;margin:0 auto;display:flex;gap:8px}
.foot .primary{min-height:52px;font-size:19px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{border:0;background:none;font:600 15px/1 var(--body);padding:8px 0;color:var(--ink)}
.hint{color:var(--muted);font-size:13px;margin:0}
.linkout{width:100%;min-height:90px;border-radius:14px;border:1.5px solid var(--line2);padding:10px;font:12px/1.35 ui-monospace,monospace;background:var(--bg);color:var(--ink)}
dialog .sheet label.f{color:var(--muted)}
/* versione da solo: procedura guidata (solo.js) */
.wz{display:flex;flex-direction:column;gap:16px}
.wz h2{margin:0}
.wzhero p{margin:8px 0 0;line-height:1.45}
.wzbar{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.wzbar span{height:4px;border-radius:4px;background:var(--line2)}
.wzbar span.on{background:var(--accent)}
.wzlist{display:flex;flex-direction:column;gap:10px}
.wzopt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1.5px solid var(--line2);border-radius:18px;padding:16px}
.wzopt b{font:700 17px/1.15 var(--body)}
.wzopt small{color:var(--muted);font:500 14px/1.3 var(--body)}
.wzopt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.wzopt[aria-pressed="true"] small{color:var(--on-accent);opacity:.8}
.wztabs{margin-top:4px;padding-top:12px;border-top:1px solid var(--line2)}
.wztabs .wzopt{border-radius:12px!important;padding:9px 12px!important}
.wztabs .wzopt b{font-size:14px!important}
.wzopt:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wzchips{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.wzchips .wzopt{align-items:center;padding:13px 6px}
.wzchips.wzwrap{display:flex;flex-wrap:wrap}
.wzchips.wzwrap .wzopt{padding:11px 14px;border-radius:999px}
.wzchips.wzwrap .wzopt b{font-size:15px}
.wzg{margin-top:6px}
.wzgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.wzt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:6px;background:var(--bg);border:1.5px solid var(--line2);border-radius:16px;padding:6px 6px 9px;position:relative;font:600 13px/1.2 var(--body);overflow-wrap:anywhere}
.wzt img,.wzt .noimg{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;border-radius:11px;display:block}
.wzt span{padding:0 3px}
.wzt small{display:block;color:var(--muted);font-weight:500}
.wzt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--bg))}
.wzt[aria-pressed="true"]::after{content:"✓";position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:800 15px/1 var(--body)}
.wzsel{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.wzsel li{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--bg);border-radius:14px;padding:8px 8px 8px 12px}
.wzsel li span{font:600 14px/1.25 var(--body);min-width:0}
.wzsel small{display:block;color:var(--muted);font-weight:500}
.wzchk{display:flex;align-items:center;gap:10px;font:500 15px/1.3 var(--body);padding:6px 0}
.wzchk input{width:22px;height:22px;accent-color:var(--accent)}
.wzdone{border:1.5px solid color-mix(in srgb,var(--accent) 45%,transparent)}
.wzdone h2{margin:0}
.catres button[aria-pressed="true"]{outline:2px solid var(--accent)}
.chk{color:#C76A1E;font-weight:700}
.wzmano{align-self:center;margin-top:4px}
.wztesto textarea{min-height:300px;font:500 16px/1.5 var(--body)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ingresso a schermi corti: una card, titolo grande, due righe, un bottone */
.wzc{background:var(--raise,var(--surface));border-radius:28px;padding:28px 22px 22px;display:flex;flex-direction:column;gap:18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.wzc h2{font-size:36px;line-height:1.02;text-transform:none}
.wzc>p{margin:0;font:400 18px/1.45 var(--body);color:var(--muted)}
.wzc .primary{margin-top:6px}
.wzc .f input{font-size:20px;padding:15px 16px;border-radius:16px}
.wzic{display:grid;place-items:center;width:112px;height:112px;margin:6px auto;border-radius:50%;background:color-mix(in srgb,var(--accent) 18%,var(--bg));color:var(--ink)}
.wzpassi{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px;counter-reset:p}
.wzpassi li{counter-increment:p;display:flex;flex-direction:column;gap:3px;font:400 16px/1.4 var(--body);color:var(--muted)}
.wzpassi b{font:700 17px/1.25 var(--body);color:var(--ink)}
.wzpassi b::before{content:counter(p) ". "}
.wzdots{display:flex;gap:5px}
.wzdots span{width:18px;height:4px;border-radius:4px;background:var(--line2)}
.wzdots span.on{background:var(--accent)}
.wz .top{min-height:34px}
/* la tua scheda: come l'hai scritta, con la figura di ogni esercizio */
.shint{margin:8px 0 0;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sx{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.sx li{display:grid;grid-template-columns:68px 1fr;gap:12px;align-items:center;background:var(--bg);border-radius:16px;padding:8px}
.sfig{all:unset;box-sizing:border-box;width:68px;height:68px;border-radius:12px;background:#fff;display:grid;place-items:center;overflow:hidden;color:#8a8478}
button.sfig{cursor:pointer}
.sfig img{width:100%;height:100%;object-fit:contain}
.sfig.q{background:color-mix(in srgb,var(--accent) 22%,var(--bg));border:2px dashed var(--accent)}
.fq{font:800 34px/1 var(--body);color:var(--ink)}
.fq.mini{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:15px;background:color-mix(in srgb,var(--accent) 30%,var(--bg))}
.fx{font:700 22px/1 var(--body);display:grid;place-items:center}
.st{all:unset;box-sizing:border-box;cursor:pointer;min-width:0;display:flex;flex-direction:column;gap:3px}
.st b{font:600 16px/1.25 var(--body);overflow-wrap:anywhere}
.st small{color:var(--muted);font:500 13px/1.3 var(--body)}
.st small.sm{color:var(--ink);opacity:.75}
.st small.q{color:#C76A1E;opacity:1;font-weight:700}
.sdn{display:flex;align-items:center;gap:10px;font:700 19px/1.25 var(--body)!important;text-transform:none!important;letter-spacing:0!important;margin:2px 0 4px}
.sdn .sw{width:12px;height:12px;border-radius:50%;background:var(--dc);flex:none}
.sadd{align-self:flex-start;color:var(--muted);padding:4px 2px}
.sprof{align-self:center;color:var(--muted)}
#sheet .wzgrid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
</style>
</head><body>
<header class="apphead"><h1 id="hd">Coach</h1><span class="avatar" id="av" aria-hidden="true"></span></header>
<main class="cw" id="v"></main>
<div class="foot" id="foot" hidden><div class="in" id="footIn"></div></div>
<dialog id="dlg"><div class="sheet" id="sheet"></div></dialog>
<div class="toast" id="toast" hidden></div>
<script src="config.js"></script>
<script src="licenza.js"></script>
<script>
(function(){
const C = window.CONFIG || {};
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// #prova: pagina Coach di prova, con due clienti già pronti e schede salvate a parte (non tocca quelle vere)
const PROVA = location.hash === '#prova';
// #solo: versione per chi si allena da solo (solo.js): procedura guidata, una sola scheda, "Usa questa scheda" la mette nell'app
const SOLO = !PROVA && /^#solo/.test(location.hash);
const CKEY = PROVA ? 'coach-pt-prova-v1' : SOLO ? 'solo-pt-v1' : 'coach-pt-v1';
const M = {}; (C.macchine || []).forEach(m => M[m.id] = m);
const GRUPPI = (C.gruppi || ['Petto','Spalle','Schiena','Tricipiti','Bicipiti','Quadricipiti','Femorali','Glutei','Polpacci','Addominali']);
const VV = ['A','B','C'];
const iso = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const MESI = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const fmt = s => { const [y,m,d] = s.split('-').map(Number); return d + ' ' + MESI[m-1] + ' ' + y; };
const uid = () => 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);

// colore del coach, come nell'app del cliente
(function(){
  if (!/^#[0-9a-f]{6}$/i.test(C.colore || '')) return;   // senza colore resta quello del tema
  const c = C.colore;
  const n = parseInt(c.slice(1), 16), lum = (0.299 * (n >> 16) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) / 255;
  document.documentElement.style.setProperty('--accent', c);
  document.documentElement.style.setProperty('--on-accent', lum < 0.6 ? '#FFFFFF' : '#111111');
})();
$('hd').textContent = SOLO ? 'La tua scheda' : 'Coach'; $('av').textContent = (C.coach || 'C').trim().charAt(0).toUpperCase();
if (SOLO) document.title = 'La tua scheda';

let db = {clienti: []};
try { const x = JSON.parse(localStorage.getItem(CKEY)); if (x && Array.isArray(x.clienti)) db = x; } catch (e) {}
const save = () => { try { localStorage.setItem(CKEY, JSON.stringify(db)); } catch (e) { toast('Memoria piena: scarica un backup'); } };
// macchine scelte dal catalogo dei produttori (catalogo/catalogo.json): restano salvate qui e viaggiano nel link
const LIB = new Set(Object.keys(M));
db.cat = db.cat || {};
Object.keys(db.cat).forEach(id => { if (!M[id]) M[id] = db.cat[id]; });
let cur = null, tab = {}, view = 'list';
// versione da solo: se la scheda c'è già si apre per modificarla, altrimenti parte la procedura guidata
let SMOD = null;
if (SOLO) {
  // dall'icona sulla Home (coach.html#solo) con la scheda già in uso si va dritti all'app; "Modifica la scheda" usa #solo-modifica
  let inUso = false; try { inUso = !!localStorage.getItem('scheda-pt-scheda-v1'); } catch (e) {}
  if (location.hash === '#solo' && db.clienti[0] && !db.clienti[0].nuova && inUso) location.replace('index.html');
  if (db.clienti[0]) { cur = db.clienti[0].id; view = 'edit'; } else view = 'wiz';
  import('./solo.js').then(m => { SMOD = m; if (view === 'wiz') m.avvia(); render(); if (view === 'edit') loadCat(); }).catch(() => { $('v').innerHTML = '<div class="card"><p style="margin:0">Non riesco ad aprire la procedura: ricarica la pagina con internet.</p></div>'; });
}
const get = id => db.clienti.find(c => c.id === id);
let tt; function toast(m){ const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2400); }

// ---------- link per il cliente: scheda compressa dentro l'indirizzo ----------
const b64e = u => { let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
function clean(c){
  // solo quello che serve al cliente, con chiavi corte
  return {id: c.id, cliente: c.cliente, obiettivo: +c.obiettivo || c.giorni.length, varC: c.varC || 'Corpo libero', data: c.data,
    giorni: c.giorni.map(g => { const o = {id: g.id, nome: g.nome}; if (g.nota) o.nota = g.nota;
      VV.forEach(v => { if ((g[v] || []).length) o[v] = g[v].map(e => { const x = {}; if (e.m) x.m = e.m; if (e.n || !e.m) x.n = e.n || 'Esercizio'; x.s = +e.s || 3; x.r = e.r || '10'; if (e.g && e.g.length) x.g = e.g; if (e.p) x.p = e.p; if (e.c && e.c.length) x.c = e.c; if (e.x) x.x = e.x; if (e.xt) x.xt = e.xt; return x; }); });
      return o; }),
    note: (c.note || []).filter(Boolean), mac: macOf(c)};
}
// macchine del catalogo usate nella scheda: nome, marca, muscoli e foto vanno al cliente insieme alla scheda
function macOf(c){
  const o = {};
  c.giorni.forEach(g => VV.forEach(v => (g[v] || []).forEach(e => {
    const m = e.m && !LIB.has(e.m) && M[e.m]; if (!m || o[e.m]) return;
    o[e.m] = {n: m.nome, b: m.marca, l: m.linea, d: m.distretto, g: m.gruppi, f: m.foto, u: m.link || m.url || ''};
  })));
  return Object.keys(o).length ? o : undefined;
}
// ---------- catalogo dei produttori: si scarica solo quando serve (circa 50 KB compresso), le foto una alla volta ----------
let CAT = null, catP = null;
function loadCat(){
  if (CAT) return Promise.resolve(CAT);
  return catP = catP || fetch('catalogo/catalogo.json').then(r => r.json()).then(d => {
    const k = d.campi; CAT = d.m.map(a => { const o = {}; k.forEach((x, i) => o[x] = a[i]); return o; });
    // schede vecchie o caricate da backup: ritrova le macchine del catalogo che mancano
    const by = {}; CAT.forEach(m => by[m.id] = m);
    db.clienti.forEach(c => c.giorni.forEach(g => VV.forEach(v => (g[v] || []).forEach(e => { if (e.m && !M[e.m] && by[e.m]) { M[e.m] = by[e.m]; db.cat[e.m] = by[e.m]; } }))));
    return CAT;
  }).catch(() => { catP = null; return null; });
}
async function encode(c){
  const bytes = new TextEncoder().encode(JSON.stringify(clean(c)));
  if (window.CompressionStream) {
    try { const z = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate'))).arrayBuffer()); return 'z' + b64e(z); } catch (e) {}
  }
  return 'j' + b64e(bytes);
}
function appUrl(){
  if (C.indirizzo) return C.indirizzo.replace(/\/?(index\.html)?$/, '/');
  return location.href.replace(/[#?].*$/, '').replace(/coach\.html$/, '');
}

// ---------- modelli ----------
const emptyDay = (i, nome) => ({id: 'g' + i, nome: nome || 'Allenamento ' + i, nota: '', A: [], B: [], C: []});
function newClient(from){
  const c = from ? JSON.parse(JSON.stringify(from)) : {cliente: '', obiettivo: 3, varC: 'Corpo libero', giorni: [emptyDay(1, 'Allenamento A'), emptyDay(2, 'Allenamento B'), emptyDay(3, 'Allenamento C')], note: []};
  c.id = uid(); c.cliente = from ? '' : c.cliente; c.data = iso(new Date());
  // dalla scheda di esempio: solo le chiavi che usa l'editor
  c.giorni = c.giorni.map(g => ({id: g.id, nome: g.nome, nota: g.nota || '', A: g.A || [], B: g.B || [], C: g.C || []}));
  db.clienti.unshift(c); save(); return c;
}
const freeDayId = c => { for (let i = 1; i <= 6; i++) if (!c.giorni.some(g => g.id === 'g' + i)) return i; return 0; };
const exLabel = e => e.m && M[e.m] ? M[e.m].nome : (e.n || 'Esercizio');

// ---------- prova a tempo (facoltativa) ----------
// solo se in config.js c'è "scadenza" (AAAA-MM-GG): dal giorno dopo la pagina Coach si blocca, niente schede nuove né modifiche.

// ---------- riconoscere la macchina da una foto (riconosci.js: modello sul telefono + confronto con le foto del catalogo) ----------
// Ricordi: quando il coach sceglie la macchina giusta dopo una foto, l'impronta di quella foto resta salvata (db.ricordi, va anche nel backup).
// La volta dopo, una foto simile della stessa macchina della sua palestra viene riconosciuta subito.
db.ricordi = db.ricordi || {};
const rec = {live: 0, stream: null, cv: null, q: null, top: []};
const recKey = () => { try { return localStorage.getItem('coach-pt-claude') || ''; } catch (e) { return ''; } };
let recMod = null; const RC = () => recMod = recMod || import('./riconosci.js');
function recStop(){ rec.live++; if (rec.stream) { rec.stream.getTracks().forEach(t => t.stop()); rec.stream = null; } }
$('dlg').addEventListener('close', recStop);
const recSt = t => { const o = $('recOut'); if (o) o.innerHTML = '<p class="recst">' + esc(t) + '</p>'; };
const recEtichetta = m => [m.marca, m.nome, m.linea].filter(Boolean).join(' · ');
const recMem = R => Object.keys(db.ricordi).flatMap(id => db.ricordi[id].map(x => ({id, v: R.decodifica(x)})));
function recRicorda(id){
  if (!rec.q || !recMod) return;
  recMod.then(R => { const a = db.ricordi[id] = db.ricordi[id] || []; a.unshift(R.codifica(rec.q)); a.length = Math.min(a.length, 4); save(); });
}
const recRow = (m, nota) => machRow(Object.assign({}, m, {linea: [m.marca, m.linea].filter(Boolean).join(' · ') + (nota ? ' · ' + nota : ''), marca: m.lib ? [m.marca, nota].filter(Boolean).join(' · ') : m.marca}));
function recShow(top){
  const by = {}; pool().forEach(m => by[m.id] = m);
  const rows = top.map(t => ({t, m: by[t.id]})).filter(x => x.m);
  const g = rows.length ? rows[0].t.sim : 0;
  // soglie: con foto vere di palestra la macchina giusta del catalogo raramente supera 0,75; un ricordo della stessa macchina sì
  const verdetto = g >= .85 ? 'Molto probabile' : g >= .7 ? 'Possibile: controlla' : 'Poco sicuro: sono macchine dalla forma simile';
  $('recOut').innerHTML = '<div class="eyebrow">' + verdetto + '</div><ul class="catres">' + rows.slice(0, 5).map(x => recRow(x.m, x.t.mem ? 'già vista qui' : '')).join('') + '</ul>' +
    (rec.cv && !rec.stream ? '<button type="button" class="ghost small" data-r="claude">Chiedi a Claude</button>' : '') + '<div id="recAI"></div>' +

}
async function recCalcola(R, cv){ rec.q = await R.impronta(cv); return R.confronta(rec.q, recMem(R)); }
async function recFoto(file){
  recStop(); const id = rec.live;
  try {
    recSt('Leggo la foto…'); const R = await RC(); rec.cv = await R.preparaFoto(file);
    const v = $('recV'); if (!v) return; v.replaceChildren(rec.cv);
    await loadCat(); recSt('Preparo il riconoscimento… la prima volta scarico 24 MB (serve internet).');
    await R.pronto(); if (rec.live !== id) return;
    rec.top = R.migliori(await recCalcola(R, rec.cv), 12); if (rec.live === id) recShow(rec.top);
  } catch (e) { recSt('Non ci sono riuscito: ' + (e.message || e) + '. Serve internet la prima volta.'); }
}
async function recLive(){
  recStop(); const id = rec.live;
  try { rec.stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: 'environment'}}, audio: false}); }
  catch (e) { recSt('Fotocamera non disponibile o non permessa: usa "Scatta o scegli una foto".'); return; }
  const v = document.createElement('video'); v.playsInline = true; v.muted = true; v.srcObject = rec.stream;
  const box = $('recV'); box.replaceChildren(v);
  const stop = document.createElement('button'); stop.type = 'button'; stop.className = 'ghost small'; stop.dataset.r = 'stop'; stop.textContent = 'Ferma e tieni questa foto'; box.appendChild(stop);
  await v.play(); recSt('Preparo il riconoscimento… la prima volta scarico 24 MB (serve internet).');
  try {
    const R = await RC(); await loadCat(); await R.pronto();
    let ema = null, last = '';
    while (rec.live === id) {
      const cv = await R.preparaFoto(v, 336), res = await recCalcola(R, cv);
      if (rec.live !== id) return;
      // media degli ultimi fotogrammi: la lista non salta a ogni movimento
      ema = ema && ema.length === res.sim.length ? ema.map((x, i) => .5 * x + .5 * res.sim[i]) : res.sim; rec.cv = cv;
      const top = R.migliori({ids: res.ids, sim: ema, n: res.n}, 12), k = top.slice(0, 5).map(t => t.id).join();
      rec.top = top; if (k !== last) { last = k; recShow(top); }
      await new Promise(r => setTimeout(r, 120));
    }
  } catch (e) { if (rec.live === id) recSt('Non ci sono riuscito: ' + (e.message || e)); }
}
// cerca nel catalogo il nome letto da Claude (es. "Panatta" + "Power Row")
function recCercaNome(r){
  const low = x => String(x || '').toLowerCase(), w = low(r.nome).split(/[^a-z0-9àèéìòù]+/).filter(x => x.length > 1), marca = low(r.marca).split(/\s+/)[0];
  if (!w.length) return [];
  return pool().map(m => { const n = low(m.nome), hit = w.filter(x => n.includes(x)).length; return {m, p: hit / w.length + (marca && low(m.marca).includes(marca) ? .5 : 0) - Math.abs(n.split(/\s+/).length - w.length) * .02}; })
    .filter(x => x.p >= .99).sort((a, b) => b.p - a.p).slice(0, 3).map(x => x.m);
}

  const blob = new Blob([JSON.stringify({tipo: 'coach-pt', data: iso(new Date()), clienti: db.clienti, cat: db.cat, ricordi: db.ricordi}, null, 1)], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'schede-clienti-' + iso(new Date()) + '.json'; document.body.appendChild(a); a.click(); a.remove();

}
document.addEventListener('change', e => {
  if (e.target.id !== 'bkfile' || !e.target.files[0]) return;
  e.target.files[0].text().then(txt => {
    const j = JSON.parse(txt); if (!j || !Array.isArray(j.clienti)) throw 0;
    const have = new Set(db.clienti.map(c => c.id)); let n = 0, u = 0;
    if (j.ricordi && typeof j.ricordi === 'object') Object.keys(j.ricordi).forEach(id => { if (!db.ricordi[id] && Array.isArray(j.ricordi[id])) db.ricordi[id] = j.ricordi[id]; });
    if (j.cat && typeof j.cat === 'object') Object.keys(j.cat).forEach(id => { if (!db.cat[id]) db.cat[id] = j.cat[id]; if (!M[id]) M[id] = j.cat[id]; });
    j.clienti.forEach(c => { if (!c || !c.id || !Array.isArray(c.giorni)) return; if (have.has(c.id)) { const i = db.clienti.findIndex(x => x.id === c.id); if ((c.data || '') > (db.clienti[i].data || '')) { db.clienti[i] = c; u++; } } else { db.clienti.push(c); n++; } });
    save(); render(); toast('Backup caricato: ' + n + ' nuovi, ' + u + ' aggiornati');
  }).catch(() => toast('File non valido'));
});

  try { localStorage.setItem('scheda-pt-scheda-v1', JSON.stringify(s)); localStorage.setItem('scheda-pt-modo', 'solo'); }

}
